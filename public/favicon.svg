<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131318" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="hk-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2" />

  <!-- Monogram Lines: Distinct H and K -->
  <g stroke="url(#hk-accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter H -->
    <line x1="14" y1="17" x2="14" y2="47" />
    <line x1="14" y1="32" x2="28" y2="32" />
    <line x1="28" y1="17" x2="28" y2="47" />

    <!-- Letter K -->
    <line x1="38" y1="17" x2="38" y2="47" />
    <line x1="38" y1="32" x2="51" y2="17" />
    <line x1="38" y1="32" x2="51" y2="47" />
  </g>

  <!-- Balanced Glowing Accent Dots -->
  <circle cx="14" cy="17" r="2.2" fill="#ffffff" />
  <circle cx="14" cy="47" r="2.2" fill="#ffffff" />
  <circle cx="51" cy="17" r="2.2" fill="#ffffff" />
  <circle cx="51" cy="47" r="2.2" fill="#ffffff" />
</svg>