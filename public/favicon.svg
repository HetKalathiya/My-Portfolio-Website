<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="hk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#09090b" stroke="url(#bg-border)" stroke-width="2" />

  <!-- Interlocking HK Monogram -->
  <g stroke="url(#hk-grad)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- H Left Column -->
    <line x1="16" y1="16" x2="16" y2="48" />
    <!-- H Middle Bridge -->
    <line x1="16" y1="32" x2="32" y2="32" />
    <!-- Shared H/K Column -->
    <line x1="32" y1="16" x2="32" y2="48" />
    <!-- K Upper Diagonal -->
    <line x1="32" y1="32" x2="48" y2="16" />
    <!-- K Lower Diagonal -->
    <line x1="32" y1="32" x2="48" y2="48" />
  </g>

  <!-- Accent Dots at Diagonal Tips -->
  <circle cx="48" cy="16" r="3" fill="#ffffff" />
  <circle cx="48" cy="48" r="3" fill="#ffffff" />
</svg>