<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="512" height="512" rx="20" fill="url(#bg)"/>

  <!-- HK monogram -->
  <g fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- H -->
    <path d="M185 142 V370"/>
    <path d="M185 256 H267"/>
    <path d="M267 142 V370"/>

    <!-- K -->
    <path d="M267 256 L345 142"/>
    <path d="M267 256 L350 370"/>
  </g>

  <!-- Clean white highlights -->
  <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 142 V370"/>
    <path d="M185 256 H267"/>
    <path d="M267 142 V370"/>
    <path d="M267 256 L345 142"/>
    <path d="M267 256 L350 370"/>
  </g>

  <!-- Small terminal dots matching the reference style -->
  <circle cx="345" cy="142" r="7" fill="#ffffff"/>
  <circle cx="350" cy="370" r="7" fill="#ffffff"/>
</svg>