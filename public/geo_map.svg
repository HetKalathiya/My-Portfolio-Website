<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="geoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <radialGradient id="emeraldGlow" cx="35%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="70%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="mapCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>

    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#geoBg)" />
  <circle cx="300" cy="220" r="280" fill="url(#emeraldGlow)" />
  <circle cx="600" cy="300" r="260" fill="url(#purpleGlow)" />

  <!-- Topographic Contour Lines -->
  <g fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5">
    <path d="M 50 120 Q 200 40 400 130 T 750 100" />
    <path d="M 30 180 Q 220 90 420 200 T 770 170" />
    <path d="M 60 250 Q 250 160 450 260 T 740 240" />
    <path d="M 20 320 Q 210 230 480 330 T 780 310" />
    <path d="M 70 390 Q 280 300 520 400 T 730 380" />
  </g>

  <!-- Hexagonal Grid Overlay -->
  <g fill="none" stroke="rgba(16, 185, 129, 0.12)" stroke-width="1">
    <polygon points="150,100 180,82 210,100 210,135 180,152 150,135" />
    <polygon points="210,100 240,82 270,100 270,135 240,152 210,135" />
    <polygon points="180,152 210,135 240,152 240,187 210,205 180,187" />
    <polygon points="240,152 270,135 300,152 300,187 270,205 240,187" stroke="rgba(16, 185, 129, 0.4)" fill="rgba(16, 185, 129, 0.08)" />
    <polygon points="300,152 330,135 360,152 360,187 330,205 300,187" />
    <polygon points="270,205 300,187 330,205 330,240 300,257 270,240" stroke="rgba(139, 92, 246, 0.4)" fill="rgba(139, 92, 246, 0.08)" />
    <polygon points="330,205 360,187 390,205 390,240 360,257 330,240" />
  </g>

  <!-- UI Window Container -->
  <rect x="60" y="50" width="680" height="400" rx="16" fill="url(#mapCardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Window Top Bar -->
  <path d="M 60 66 A 16 16 0 0 1 76 50 L 724 50 A 16 16 0 0 1 740 66 L 740 95 L 60 95 Z" fill="rgba(255,255,255,0.04)" />
  <circle cx="90" cy="72" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="106" cy="72" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="122" cy="72" r="5" fill="#10b981" opacity="0.8" />
  <text x="400" y="77" fill="#a1a1aa" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">GEO MAP // GEOSPATIAL INTELLIGENCE &amp; TRACKING ENGINE</text>

  <!-- Route Polyline with Glow -->
  <path d="M 140 350 C 220 280, 260 380, 360 220 S 480 180, 620 160" fill="none" stroke="url(#routeGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 140 350 C 220 280, 260 380, 360 220 S 480 180, 620 160" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 4" opacity="0.8" />

  <!-- Animated Map Markers / Waypoints -->
  <!-- Marker 1: Origin -->
  <g transform="translate(140, 350)">
    <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.2" />
    <circle cx="0" cy="0" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Marker 2: Waypoint Alpha -->
  <g transform="translate(360, 220)">
    <circle cx="0" cy="0" r="18" fill="#3b82f6" opacity="0.25" />
    <circle cx="0" cy="0" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <!-- Tooltip -->
    <rect x="-45" y="-38" width="90" height="24" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#3b82f6" stroke-width="1" />
    <text x="0" y="-22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">NODE-ALPHA</text>
  </g>

  <!-- Marker 3: Target -->
  <g transform="translate(620, 160)">
    <circle cx="0" cy="0" r="22" fill="#8b5cf6" opacity="0.3" />
    <circle cx="0" cy="0" r="9" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Top-Right Telemetry Floating Card -->
  <g transform="translate(490, 220)">
    <rect x="0" y="0" width="210" height="130" rx="12" fill="rgba(10, 15, 30, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="16" y="26" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1">LIVE SPATIAL DATA</text>
    
    <text x="16" y="52" fill="#64748b" font-family="monospace" font-size="11">LAT / LNG:</text>
    <text x="85" y="52" fill="#10b981" font-family="monospace" font-size="11">37.7749&#176; N, 122.4194&#176; W</text>
    
    <text x="16" y="74" fill="#64748b" font-family="monospace" font-size="11">ELEVATION:</text>
    <text x="85" y="74" fill="#38bdf8" font-family="monospace" font-size="11">1,420m (3D Mesh)</text>

    <text x="16" y="96" fill="#64748b" font-family="monospace" font-size="11">LAYERS:</text>
    <text x="85" y="96" fill="#a78bfa" font-family="monospace" font-size="11">Vector, Heatmap, Terrain</text>
    
    <text x="16" y="116" fill="#64748b" font-family="monospace" font-size="10">RENDER TIME:</text>
    <text x="98" y="116" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">60 FPS (Mapbox GL)</text>
  </g>

  <!-- Bottom Left Tech Stack Badges -->
  <g transform="translate(80, 415)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="45" y="16" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Mapbox GL</text>

    <rect x="100" y="0" width="80" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="140" y="16" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Deck.gl</text>

    <rect x="190" y="0" width="80" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="230" y="16" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Leaflet</text>

    <rect x="280" y="0" width="84" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="322" y="16" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Turf.js</text>
  </g>
</svg>
