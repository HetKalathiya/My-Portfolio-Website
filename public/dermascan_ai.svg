<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>
    
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="400" cy="250" r="300" fill="url(#glowTeal)" />
  <circle cx="650" cy="150" r="250" fill="url(#glowIndigo)" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400 M 0 450 L 800 450" />
    <path d="M 100 0 L 100 500 M 200 0 L 200 500 M 300 0 L 300 500 M 400 0 L 400 500 M 500 0 L 500 500 M 600 0 L 600 500 M 700 0 L 700 500" />
  </g>

  <!-- UI Window Container -->
  <rect x="60" y="50" width="680" height="400" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <path d="M 60 66 A 16 16 0 0 1 76 50 L 724 50 A 16 16 0 0 1 740 66 L 740 95 L 60 95 Z" fill="rgba(255,255,255,0.04)" />
  <circle cx="90" cy="72" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="106" cy="72" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="122" cy="72" r="5" fill="#10b981" opacity="0.8" />
  <text x="400" y="77" fill="#a1a1aa" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">DERMASCAN-AI // CLINICAL NEURAL ENGINE v2.4</text>

  <!-- Scanner Reticle Graphic -->
  <g transform="translate(240, 260)">
    <!-- Outer Scanning Rings -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#06b6d4" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#06b6d4" />
    
    <!-- Target Crosshairs -->
    <path d="M -120 0 L -80 0 M 80 0 L 120 0 M 0 -120 L 0 -80 M 0 80 L 0 120" stroke="#06b6d4" stroke-width="2" opacity="0.8" />
    
    <!-- Corner Reticles -->
    <path d="M -100 -80 L -100 -100 L -80 -100" fill="none" stroke="#06b6d4" stroke-width="2" />
    <path d="M 100 -80 L 100 -100 L 80 -100" fill="none" stroke="#06b6d4" stroke-width="2" />
    <path d="M -100 80 L -100 100 L -80 100" fill="none" stroke="#06b6d4" stroke-width="2" />
    <path d="M 100 80 L 100 100 L 80 100" fill="none" stroke="#06b6d4" stroke-width="2" />
    
    <!-- Simulated Heatmap / Lesion Nodes -->
    <path d="M -30 -10 Q 0 -40 35 -15 Q 40 25 10 35 Q -35 40 -30 -10 Z" fill="#06b6d4" opacity="0.25" />
    <circle cx="-15" cy="-5" r="3" fill="#38bdf8" />
    <circle cx="15" cy="10" r="4" fill="#38bdf8" />
    <circle cx="0" cy="20" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Right Analytics Panel -->
  <g transform="translate(440, 120)">
    <!-- Card 1: Diagnostic Accuracy -->
    <rect x="0" y="0" width="260" height="90" rx="12" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <text x="18" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">DIAGNOSTIC ACCURACY</text>
    <text x="18" y="65" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">98.6%</text>
    <text x="145" y="62" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">AUC 0.992</text>

    <!-- Card 2: Risk Classifier Breakdown -->
    <rect x="0" y="110" width="260" height="190" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="18" y="135" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">CLASSIFIER CONFIDENCE</text>
    
    <!-- Progress Bar 1 -->
    <text x="18" y="165" fill="#e2e8f0" font-family="sans-serif" font-size="12">Melanoma Detection</text>
    <text x="210" y="165" fill="#06b6d4" font-family="monospace" font-size="12">99.1%</text>
    <rect x="18" y="173" width="224" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="18" y="173" width="222" height="6" rx="3" fill="url(#accentGrad)" />

    <!-- Progress Bar 2 -->
    <text x="18" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="12">Basal Cell Carcinoma</text>
    <text x="210" y="205" fill="#06b6d4" font-family="monospace" font-size="12">97.8%</text>
    <rect x="18" y="213" width="224" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="18" y="213" width="216" height="6" rx="3" fill="url(#accentGrad)" />

    <!-- Progress Bar 3 -->
    <text x="18" y="245" fill="#e2e8f0" font-family="sans-serif" font-size="12">Benign Nevi</text>
    <text x="210" y="245" fill="#06b6d4" font-family="monospace" font-size="12">98.4%</text>
    <rect x="18" y="253" width="224" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="18" y="253" width="218" height="6" rx="3" fill="url(#accentGrad)" />
  </g>

  <!-- Bottom Tech Tags -->
  <g transform="translate(80, 415)">
    <rect x="0" y="0" width="84" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="42" y="16" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">PyTorch</text>
    
    <rect x="94" y="0" width="94" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="141" y="16" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">ResNet-50</text>

    <rect x="198" y="0" width="94" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="245" y="16" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">OpenCV</text>

    <rect x="302" y="0" width="84" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="344" y="16" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">FastAPI</text>
  </g>
</svg>
